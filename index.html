<style>
  :root {
    --bg: #f2f4ef;
    --surface: #fdfdfb;
    --surface-raised: #ffffff;
    --ink: #182420;
    --ink-soft: #4c5a53;
    --border: #d7ddd0;
    --accent: #1e6e62;
    --accent-ink: #0d3a33;
    --accent-soft: #dcece7;
    --success: #2f7a4f;
    --success-soft: #e2f0e6;
    --warning: #a6740e;
    --warning-soft: #f5ebd4;
    --critical: #b23a3a;
    --critical-soft: #f6e0df;
    --info: #4a5f6b;
    --info-soft: #e4eaec;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 16px rgba(20, 30, 25, 0.05);
    --radius: 8px;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101512;
      --surface: #171e1a;
      --surface-raised: #1d2521;
      --ink: #e7ece7;
      --ink-soft: #a4b0a8;
      --border: #2b352f;
      --accent: #52bda9;
      --accent-ink: #d3f0e9;
      --accent-soft: #1c3833;
      --success: #55b17d;
      --success-soft: #1c3327;
      --warning: #d9ab4a;
      --warning-soft: #3a2f16;
      --critical: #e0837c;
      --critical-soft: #3a2422;
      --info: #93a8b3;
      --info-soft: #212c31;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101512;
    --surface: #171e1a;
    --surface-raised: #1d2521;
    --ink: #e7ece7;
    --ink-soft: #a4b0a8;
    --border: #2b352f;
    --accent: #52bda9;
    --accent-ink: #d3f0e9;
    --accent-soft: #1c3833;
    --success: #55b17d;
    --success-soft: #1c3327;
    --warning: #d9ab4a;
    --warning-soft: #3a2f16;
    --critical: #e0837c;
    --critical-soft: #3a2422;
    --info: #93a8b3;
    --info-soft: #212c31;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #f2f4ef;
    --surface: #fdfdfb;
    --surface-raised: #ffffff;
    --ink: #182420;
    --ink-soft: #4c5a53;
    --border: #d7ddd0;
    --accent: #1e6e62;
    --accent-ink: #0d3a33;
    --accent-soft: #dcece7;
    --success: #2f7a4f;
    --success-soft: #e2f0e6;
    --warning: #a6740e;
    --warning-soft: #f5ebd4;
    --critical: #b23a3a;
    --critical-soft: #f6e0df;
    --info: #4a5f6b;
    --info-soft: #e4eaec;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }

  a { color: var(--accent); }

  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ---------- Header ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 16px;
  }
  .masthead-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.9rem;
    margin: 0;
    letter-spacing: 0.2px;
    text-wrap: balance;
  }
  .masthead-meta {
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Stat strip ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--tile-color, var(--accent));
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .stat-tile .num {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-tile .label {
    margin-top: 4px;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------- Quick capture ---------- */
  .quick-capture {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .quick-capture:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  #quick-form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 6px 6px 14px;
  }
  .quick-icon { color: var(--accent); font-size: 1rem; flex: 0 0 auto; }
  #quick-input {
    flex: 1 1 auto;
    border: none;
    background: transparent;
    padding: 10px 4px;
    font-size: 16px;
  }
  #quick-input:focus { outline: none; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .field label {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  select, input[type="search"], input[type="text"], input[type="date"], textarea {
    font-family: var(--font-ui);
    font-size: 16px;
    color: var(--ink);
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .spacer { flex: 1 1 auto; }

  button {
    font-family: var(--font-ui);
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--ink);
    padding: 8px 14px;
  }
  button:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost {
    border-color: transparent;
    background: transparent;
    padding: 6px 8px;
  }
  .btn-danger-ghost {
    border-color: transparent;
    background: transparent;
    color: var(--critical);
    padding: 6px 8px;
  }
  .btn-danger-armed {
    background: var(--critical);
    border-color: var(--critical);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.72rem;
    padding: 5px 9px;
    white-space: nowrap;
  }

  /* ---------- Urgency buckets ---------- */
  .buckets {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bucket {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--bucket-color, var(--accent));
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .bucket > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    list-style: none;
    font-weight: 600;
  }
  .bucket > summary::-webkit-details-marker { display: none; }
  .bucket > summary::before {
    content: "▸";
    color: var(--bucket-color, var(--accent));
    transition: transform 0.12s ease;
    font-size: 0.8em;
  }
  .bucket[open] > summary::before { transform: rotate(90deg); }
  .bucket.is-inbox { border-left-style: dashed; }
  .bucket-name { color: var(--ink); }
  .bucket-count {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    color: var(--bucket-color, var(--accent));
    background: color-mix(in srgb, var(--bucket-color, var(--accent)) 16%, transparent);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .bucket-hint {
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-left: 2px;
  }
  .bucket .table-wrap {
    overflow-x: auto;
    border-top: 1px solid var(--border);
  }
  @media (prefers-reduced-motion: no-preference) {
    .bucket[open] > .table-wrap { animation: rise 0.14s ease-out; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 880px;
  }
  thead th {
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    font-size: 0.87rem;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr[data-row-id] { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  tbody tr.is-overdue { background: color-mix(in srgb, var(--critical-soft) 55%, transparent); }
  tbody tr.is-overdue:hover { background: color-mix(in srgb, var(--critical-soft) 75%, transparent); }
  tbody tr.is-expanded { background: color-mix(in srgb, var(--accent-soft) 35%, transparent); }

  .steps-detail-row td {
    padding: 0;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--accent-soft) 25%, var(--surface));
    cursor: default;
  }
  .steps-detail {
    padding: 6px 14px 14px 14px;
    display: flex;
    flex-direction: column;
  }
  .detail-step-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 2px;
    cursor: pointer;
  }
  .detail-step-check { width: auto; flex: 0 0 auto; }
  .detail-step-text { flex: 1 1 auto; font-size: 0.87rem; font-weight: 600; }
  .detail-step-row:has(.detail-step-check:checked) .detail-step-text { text-decoration: line-through; color: var(--ink-soft); }
  .detail-step-row.is-confirming {
    background: color-mix(in srgb, var(--accent-soft) 65%, transparent);
    border-radius: 6px;
  }
  .detail-step-row.is-confirming .detail-step-check { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .confirm-hint { font-size: 0.68rem; color: var(--accent); font-weight: 600; white-space: nowrap; flex: 0 0 auto; }

  .lote {
    font-family: var(--font-mono);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .producto-cell .producto { font-weight: 600; }
  .producto-cell .ensayo { color: var(--ink-soft); font-size: 0.78rem; }
  .fecha { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fecha.overdue { color: var(--critical); font-weight: 600; }

  .steps-progress-wrap { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .steps-progress { height: 4px; width: 90px; background: var(--border); border-radius: 999px; overflow: hidden; flex: 0 0 auto; }
  .steps-progress-bar { height: 100%; background: var(--accent); }
  .steps-progress-label { font-size: 0.68rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .blocked-note {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    color: var(--info);
    white-space: normal;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .chip::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .chip-pendiente { background: var(--info-soft); color: var(--info); }
  .chip-analisis { background: var(--warning-soft); color: var(--warning); }
  .chip-revision { background: var(--accent-soft); color: var(--accent-ink); }
  .chip-aprobado { background: var(--success-soft); color: var(--success); }
  .chip-rechazado { background: var(--critical-soft); color: var(--critical); }

  .priority-alta { color: var(--critical); font-weight: 700; }
  .priority-media { color: var(--warning); font-weight: 700; }
  .priority-baja { color: var(--ink-soft); font-weight: 700; }

  .row-actions {
    display: flex;
    gap: 2px;
    justify-content: flex-end;
  }

  .empty-state {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .glyph { font-family: var(--font-display); font-size: 2rem; color: var(--accent); margin-bottom: 8px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 12, 0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 16px;
    z-index: 20;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface-raised);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);

    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;

    font-family: var(--font-display);
    font-size: 1.25rem;
    margin: 0;
  }
  .modal-grid {

    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .modal-grid .full { grid-column: 1 / -1; min-width: 0; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
  }
  textarea { resize: vertical; min-height: 56px; font-family: var(--font-ui); }

  .pasos-grid-scroll {
    overflow: auto;
    margin-top: 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    min-width: 0;
    max-height: 320px;
  }
  .pasos-grid-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 640px;
  }
  .pasos-grid-table th, .pasos-grid-table td {
    padding: 6px;
    text-align: center;
    font-size: 0.72rem;
    vertical-align: middle;
  }
  .pasos-grid-table thead th {
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface-raised);
  }
  .pasos-grid-table tbody th {
    text-align: left;
    font-weight: 500;
    font-size: 0.78rem;
    white-space: normal;
    max-width: 150px;
  }
  .pasos-grid-table tbody tr:not(:last-child) th,
  .pasos-grid-table tbody tr:not(:last-child) td {
    border-bottom: 1px solid var(--border);
  }
  .pasos-grid-table tr.pg-row-complete th { color: var(--ink-soft); text-decoration: line-through; }
  .pg-cell { position: relative; }
  .pg-check {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 0.62rem;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .pg-check input { width: auto; margin: 0; }
  .pg-check input:disabled { opacity: 0.35; }
  .pg-cell.is-confirming { background: color-mix(in srgb, var(--accent-soft) 65%, transparent); border-radius: 4px; }
  .pg-cell .confirm-hint { display: block; font-size: 0.55rem; white-space: nowrap; }
  .steps-empty-hint { font-size: 0.78rem; color: var(--ink-soft); padding: 6px 0; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .modal { animation: rise 0.14s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .modal-grid { grid-template-columns: 1fr; }

    .bucket .table-wrap { overflow-x: visible; }
    .bucket table { min-width: 0; }
    .bucket thead { display: none; }
    .bucket tbody { display: block; }

    tbody tr[data-row-id] {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "producto estado"
        "lote     lote"
        "prioridad fecha"
        "actions  actions";
      column-gap: 10px;
      row-gap: 5px;
      padding: 12px 14px;
    }
    tbody tr[data-row-id] td {
      padding: 0;
      border-bottom: none;
      font-size: 0.85rem;
    }
    td.producto-cell { grid-area: producto; }
    td.estado-cell { grid-area: estado; justify-self: end; text-align: right; }
    td.lote { grid-area: lote; }
    td.priority-alta, td.priority-media, td.priority-baja { grid-area: prioridad; }
    td.fecha { grid-area: fecha; justify-self: end; text-align: right; }
    td.actions-cell { grid-area: actions; }

    td.lote::before { content: "Lote "; color: var(--ink-soft); font-weight: 400; }
    td.priority-alta::before, td.priority-media::before, td.priority-baja::before {
      content: "Prioridad "; color: var(--ink-soft); font-weight: 400;
    }
    td.fecha::before { content: "Vence "; color: var(--ink-soft); font-weight: 400; }

    td.actions-cell .row-actions { justify-content: flex-end; padding-top: 4px; border-top: 1px dashed var(--border); }

    tbody tr.steps-detail-row { display: block; }
    .steps-detail-row td { display: block; padding: 0; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="masthead">
    <div class="masthead-title">
      <span class="eyebrow">Control de Calidad · Farmacéutico</span>
      <h1>Tareas del laboratorio</h1>
    </div>
    <div class="masthead-meta" id="today-label"></div>
  </header>

  <section class="quick-capture" aria-label="Captura rápida">
    <form id="quick-form">
      <span class="quick-icon" aria-hidden="true">✎</span>
      <label for="quick-input" class="sr-only">Anotar algo rápido</label>
      <input type="text" id="quick-input" placeholder="Anotá algo ya, sin completar nada más — lo organizás después…" />
      <button type="submit" class="btn-primary">Agregar</button>
    </form>
  </section>

  <section class="stats" id="stats" aria-label="Resumen de tareas"></section>

  <section class="toolbar" aria-label="Filtros">
    <div class="field" style="flex:1 1 220px;">
      <label for="f-search">Buscar</label>
      <input type="search" id="f-search" placeholder="Lote o producto…" />
    </div>
    <div class="field">
      <label for="f-estado">Estado</label>
      <select id="f-estado">
        <option value="">Todos</option>
        <option value="pendiente">Pendiente</option>
        <option value="analisis">En análisis</option>
        <option value="revision">En revisión</option>
        <option value="aprobado">Aprobado</option>
        <option value="rechazado">Rechazado / OOS</option>
      </select>
    </div>
    <div class="field">
      <label for="f-prioridad">Prioridad</label>
      <select id="f-prioridad">
        <option value="">Todas</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
    </div>
    <div class="field">
      <label for="f-ensayo">Tipo de ensayo</label>
      <select id="f-ensayo">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="btn-primary" id="btn-new" type="button">+ Nueva tarea</button>
  </section>

  <section class="buckets" id="buckets" aria-label="Tareas agrupadas por urgencia"></section>
  <div class="empty-state" id="empty-state" hidden>
    <div class="glyph">◇</div>
    <div>No hay tareas que coincidan con los filtros actuales.</div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <form class="modal" id="task-form">
    <h2 id="modal-title">Nueva tarea</h2>
    <input type="hidden" id="m-id" />
    <div class="modal-grid">
      <div class="field">
        <label for="m-lote">Lote / Batch</label>
        <input type="text" id="m-lote" required placeholder="p. ej. L-24089" />
      </div>
      <div class="field">
        <label for="m-producto">Producto</label>
        <input type="text" id="m-producto" required placeholder="p. ej. Amoxicilina 500 mg" />
      </div>
      <div class="field">
        <label for="m-prioridad">Prioridad</label>
        <select id="m-prioridad">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <div class="field">
        <label for="m-fecha">Fecha límite</label>
        <input type="date" id="m-fecha" required />
      </div>
      <div class="field full">
        <label for="m-estado">Estado</label>
        <select id="m-estado">
          <option value="pendiente">Pendiente</option>
          <option value="analisis">En análisis</option>
          <option value="revision">En revisión</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado / OOS</option>
        </select>
      </div>
      <div class="field full" style="flex-direction:row; align-items:center; gap:8px;">
        <input type="checkbox" id="m-bloqueada" style="width:auto;" />
        <label for="m-bloqueada" style="text-transform:none; letter-spacing:0; font-size:0.85rem;">Bloqueada / en espera de algo</label>
      </div>
      <div class="field full" id="m-bloqueada-wrap" hidden>
        <label for="m-bloqueada-por">Esperando…</label>
        <input type="text" id="m-bloqueada-por" placeholder="p. ej. reactivo de referencia, resultado de L-24065, equipo HPLC-2" />
      </div>
      <div class="field full" id="pasos-grid-wrap">
        <label>Pasos por ensayo</label>
        <div class="pasos-grid-scroll">
          <table class="pasos-grid-table" id="pasos-grid-table"></table>
        </div>
      </div>
      <div class="field full">
        <label for="m-notas">Notas</label>
        <textarea id="m-notas" placeholder="Observaciones, método, referencia de protocolo…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="btn-cancel">Cancelar</button>
      <button type="submit" class="btn-primary">Guardar</button>
    </div>
  </form>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "qc_lab_tasks_v1";
  var ESTADOS = {
    pendiente: { label: "Pendiente", chip: "chip-pendiente" },
    analisis: { label: "En análisis", chip: "chip-analisis" },
    revision: { label: "En revisión", chip: "chip-revision" },
    aprobado: { label: "Aprobado", chip: "chip-aprobado" },
    rechazado: { label: "Rechazado / OOS", chip: "chip-rechazado" }
  };
  var PRIORIDADES = { alta: "Alta", media: "Media", baja: "Baja" };

  var ENSAYO_GRID_COLUMNS = ["TD", "Val", "UC", "SR", "IOV", "ID", "FC"];
  var LEGACY_ENSAYO_TO_COL = {
    "Disolución": "TD", "Valoración": "Val", "Uniformidad de contenido": "UC",
    "Sustancias relacionadas": "SR", "Identificación": "ID"
  };
  var PASO_ROWS = [
    { texto: "Recolección de materiales" },
    { texto: "Búsqueda de solventes / carga de agua" },
    { texto: "Búsqueda de estándar/es, muestra/s y CR's" },
    { texto: "Pesaje de muestras" },
    { texto: "Pesaje de estándares" },
    { texto: "Resumen y cálculo de cantidades" },
    { texto: "Búsqueda y pesaje del placebo" },
    { texto: "Preparación o dilución de adecuación" },
    { texto: "Preparación de la fase móvil" },
    { texto: "Preparación o disponibilidad de los equipos" },
    { texto: "Preparación del medio de disolución", onlyFor: ["TD"] },
    { texto: "Pasaje de datos — generación de planillas de Excel" },
    { texto: "Adecuación del sistema", onlyFor: ["TD"] },
    { texto: "Cromatogramas", onlyFor: ["TD", "Val"] },
    { texto: "Impresión", onlyFor: ["Val", "UC"] },
    { texto: "Planilla", onlyFor: ["SR"] },
    { texto: "Revisión completa de los datos" },
    { texto: "Pasaje de datos a planilla de FC" },
    { texto: "Pasaje a OQSAFE de planillas" },
    { texto: "Generación de planillas de apertura y cierre de análisis" },
    { texto: "Generación y pasaje a PDF de planillas" },
    { texto: "Pegado de tickets y planillas en el cuaderno" }
  ];
  function defaultPasosGrid() {
    return PASO_ROWS.map(function (r) {
      var estados = {};
      ENSAYO_GRID_COLUMNS.forEach(function (c) {
        estados[c] = (r.onlyFor && r.onlyFor.indexOf(c) === -1) ? "na" : null;
      });
      return { texto: r.texto, estados: estados };
    });
  }
  function migratePasosToGrid(t) {
    var col = LEGACY_ENSAYO_TO_COL[t.ensayo];
    var grid = defaultPasosGrid();
    if (!col) return grid;
    var doneTexts = {};
    (t.pasos || []).forEach(function (p) { if (p.hecho) doneTexts[p.texto] = true; });
    grid.forEach(function (row) {
      ENSAYO_GRID_COLUMNS.forEach(function (c) { if (c !== col) row.estados[c] = "na"; });
      if (doneTexts[row.texto] && row.estados[col] !== "na") row.estados[col] = "hecho";
    });
    return grid;
  }
  function isPasoRowComplete(row) {
    return ENSAYO_GRID_COLUMNS.every(function (c) { return row.estados[c] === "na" || row.estados[c] === "hecho"; });
  }
  function pasosGridProgress(grid) {
    return { done: grid.filter(isPasoRowComplete).length, total: grid.length };
  }
  function buildPasosGridTableHtml(grid, confirmKey) {
    var head = "<th>Paso</th>" + ENSAYO_GRID_COLUMNS.map(function (c) { return "<th>" + c + "</th>"; }).join("");
    var order = grid.map(function (row, i) { return { row: row, i: i, complete: isPasoRowComplete(row) }; });
    order.sort(function (a, b) {
      if (a.complete !== b.complete) return a.complete ? 1 : -1;
      return a.i - b.i;
    });
    var rows = order.map(function (entry) {
      var row = entry.row, i = entry.i;
      var cells = ENSAYO_GRID_COLUMNS.map(function (c) {
        var s = row.estados[c];
        var confirming = confirmKey === (i + "|" + c + "|na") || confirmKey === (i + "|" + c + "|hecho");
        return '<td class="pg-cell' + (confirming ? " is-confirming" : "") + '">' +
          '<label class="pg-check"><input type="checkbox" data-row="' + i + '" data-col="' + c + '" data-kind="na"' + (s === "na" ? " checked" : "") + ' />N/A</label>' +
          '<label class="pg-check"><input type="checkbox" data-row="' + i + '" data-col="' + c + '" data-kind="hecho"' + (s === "hecho" ? " checked" : "") + (s === "na" ? " disabled" : "") + ' />•</label>' +
          (confirming ? '<span class="confirm-hint">¿Confirmar?</span>' : "") +
        "</td>";
      }).join("");
      return '<tr class="' + (entry.complete ? "pg-row-complete" : "") + '"><th>' + escapeHtml(row.texto) + "</th>" + cells + "</tr>";
    }).join("");
    return "<thead><tr>" + head + "</tr></thead><tbody>" + rows + "</tbody>";
  }
  function buildPasosGridDetailHtml(t) {
    var confirmKey = null;
    var prefix = t.id + "|";
    if (pendingDetailPasoKey && pendingDetailPasoKey.indexOf(prefix) === 0) {
      confirmKey = pendingDetailPasoKey.slice(prefix.length);
    }
    return '<div class="pasos-grid-scroll"><table class="pasos-grid-table" data-task-id="' + t.id + '">' +
      buildPasosGridTableHtml(t.pasosGrid, confirmKey) +
    "</table></div>";
  }

  var seed = [
    { id: uid(), lote: "L-24089", producto: "Amoxicilina 500 mg", ensayo: "Disolución", prioridad: "alta", estado: "analisis", fecha: addDays(1), notas: "USP <711>, aparato 2.", triaged: true, bloqueada: false, bloqueadaPor: "",
      pasos: [
        "Recolección de materiales",
        "Búsqueda de solventes / carga de agua",
        "Búsqueda de estándar/es, muestra/s y CR's",
        "Pesaje de muestras",
        "Pesaje de estándares",
        "Resumen y cálculo de cantidades",
        "Búsqueda y pesaje del placebo",
        "Preparación o dilución de adecuación",
        "Preparación de la fase móvil",
        "Preparación o disponibilidad de los equipos",
        "Preparación del medio de disolución",
        "Pasaje de datos — generación de planillas de Excel",
        "Adecuación del sistema",
        "Cromatogramas",
        "Revisión completa de los datos",
        "Pasaje de datos a planilla de FC",
        "Pasaje a OQSAFE de planillas",
        "Generación de planillas de apertura y cierre de análisis",
        "Generación y pasaje a PDF de planillas",
        "Pegado de tickets y planillas en el cuaderno"
      ].map(function (texto, i) { return { texto: texto, hecho: i < 5 }; }) },
    { id: uid(), lote: "L-24091", producto: "Ibuprofeno 400 mg", ensayo: "Valoración", prioridad: "media", estado: "pendiente", fecha: addDays(3), notas: "", triaged: true, bloqueada: true, bloqueadaPor: "reactivo de referencia (pedido a compras)", pasos: [] },
    { id: uid(), lote: "L-24077", producto: "Paracetamol 1g", ensayo: "Sustancias relacionadas", prioridad: "alta", estado: "rechazado", fecha: addDays(-2), notas: "Resultado fuera de especificación, en investigación.", triaged: true, bloqueada: false, bloqueadaPor: "", pasos: [] },
    { id: uid(), lote: "L-24102", producto: "Omeprazol 20 mg", ensayo: "Microbiológico", prioridad: "baja", estado: "revision", fecha: addDays(5), notas: "", triaged: true, bloqueada: false, bloqueadaPor: "", pasos: [] },
    { id: uid(), lote: "L-24065", producto: "Metformina 850 mg", ensayo: "Uniformidad de contenido", prioridad: "media", estado: "aprobado", fecha: addDays(-6), notas: "Liberado, ver COA-24065.", triaged: true, bloqueada: false, bloqueadaPor: "", pasos: [] },
    { id: uid(), lote: "—", producto: "Che, revisar si el HPLC-1 quedó calibrado después del mantenimiento", ensayo: "Otro", prioridad: "media", estado: "pendiente", fecha: null, notas: "", triaged: false, bloqueada: false, bloqueadaPor: "", pasos: [] }
  ];

  function uid() { return "t" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function addDays(n) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seed.slice();
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : seed.slice();
    } catch (e) { return seed.slice(); }
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  var tasks = load();
  var openState = {};

  var BUCKET_DEFS = [
    { key: "bandeja", label: "Bandeja rápida", hint: "sin completar — tocá ✎ para clasificarla", color: "var(--ink-soft)", openDefault: true, dashed: true },
    { key: "bloqueadas", label: "Bloqueadas", hint: "esperando algo externo — revisá si ya se destrabaron", color: "var(--info)", openDefault: true },
    { key: "vencidas", label: "Vencidas", hint: "necesitan acción ya", color: "var(--critical)", openDefault: true },
    { key: "hoy", label: "Hoy", hint: "vencen hoy", color: "var(--warning)", openDefault: true },
    { key: "semana", label: "Esta semana", hint: "próximos 7 días", color: "var(--accent)", openDefault: true },
    { key: "adelante", label: "Más adelante", hint: "sin urgencia inmediata", color: "var(--accent)", openDefault: false },
    { key: "finalizadas", label: "Finalizadas", hint: "aprobadas o rechazadas", color: "var(--success)", openDefault: false }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var fSearch = $("f-search"), fEstado = $("f-estado"), fPrioridad = $("f-prioridad"),
      fEnsayo = $("f-ensayo");
  var bucketsEl = $("buckets"), emptyState = $("empty-state"), statsEl = $("stats");
  var backdrop = $("modal-backdrop"), form = $("task-form"), modalTitle = $("modal-title");
  var quickForm = $("quick-form"), quickInput = $("quick-input");

  $("today-label").textContent = "Hoy · " + new Date().toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "numeric" });

  function isOverdue(t) {
    return t.fecha < todayStr() && t.estado !== "aprobado" && t.estado !== "rechazado";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function refreshFacetOptions() {
    var ensayos = uniqueSorted(tasks.map(function (t) { return t.ensayo; }));
    fillSelect(fEnsayo, ensayos);
  }
  function uniqueSorted(arr) {
    var seen = {}; var out = [];
    arr.forEach(function (v) { if (v && !seen[v]) { seen[v] = true; out.push(v); } });
    out.sort();
    return out;
  }
  function fillSelect(select, values) {
    var current = select.value;
    select.innerHTML = '<option value="">Todos</option>';
    values.forEach(function (v) {
      var opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      select.appendChild(opt);
    });
    if (values.indexOf(current) !== -1) select.value = current;
  }

  function computeStats() {
    var today = todayStr();
    var sinTriar = 0, vencidas = 0, hoy = 0, bloqueadas = 0, activas = 0;
    tasks.forEach(function (t) {
      if (!t.triaged) { sinTriar++; return; }
      if (t.estado === "aprobado" || t.estado === "rechazado") return;
      activas++;
      if (t.bloqueada) { bloqueadas++; return; }
      if (t.fecha < today) vencidas++;
      else if (t.fecha === today) hoy++;
    });
    return [
      { num: sinTriar, label: "Sin triar", color: "var(--ink-soft)" },
      { num: vencidas, label: "Vencidas", color: "var(--critical)" },
      { num: hoy, label: "Vencen hoy", color: "var(--warning)" },
      { num: bloqueadas, label: "Bloqueadas", color: "var(--info)" },
      { num: activas, label: "Activas en total", color: "var(--accent)" }
    ];
  }

  function renderStats() {
    var stats = computeStats();
    statsEl.innerHTML = stats.map(function (s) {
      return '<div class="stat-tile" style="--tile-color:' + s.color + ';">' +
        '<div class="num">' + s.num + "</div>" +
        '<div class="label">' + escapeHtml(s.label) + "</div>" +
        "</div>";
    }).join("");
  }

  function applyFilters(list) {
    var q = fSearch.value.trim().toLowerCase();
    return list.filter(function (t) {
      if (fEstado.value && t.estado !== fEstado.value) return false;
      if (fPrioridad.value && t.prioridad !== fPrioridad.value) return false;
      if (fEnsayo.value && t.ensayo !== fEnsayo.value) return false;
      if (q) {
        var hay = (t.lote + " " + t.producto).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function bucketize(list) {
    var today = todayStr();
    var weekLimit = addDays(7);
    var groups = { bandeja: [], bloqueadas: [], vencidas: [], hoy: [], semana: [], adelante: [], finalizadas: [] };
    list.forEach(function (t) {
      if (!t.triaged) { groups.bandeja.push(t); return; }
      if (t.estado === "aprobado" || t.estado === "rechazado") { groups.finalizadas.push(t); return; }
      if (t.bloqueada) { groups.bloqueadas.push(t); return; }
      if (t.fecha < today) groups.vencidas.push(t);
      else if (t.fecha === today) groups.hoy.push(t);
      else if (t.fecha <= weekLimit) groups.semana.push(t);
      else groups.adelante.push(t);
    });
    var prioOrder = { alta: 0, media: 1, baja: 2 };
    Object.keys(groups).forEach(function (k) {
      groups[k].sort(function (a, b) {
        if (prioOrder[a.prioridad] !== prioOrder[b.prioridad]) return prioOrder[a.prioridad] - prioOrder[b.prioridad];
        return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;
      });
    });
    return groups;
  }

  function stepsProgressHtml(t) {
    if (t.pasosGrid && t.pasosGrid.length) {
      var prog = pasosGridProgress(t.pasosGrid);
      var pctG = Math.round((prog.done / prog.total) * 100);
      return '<div class="steps-progress-wrap"><div class="steps-progress"><div class="steps-progress-bar" style="width:' + pctG + '%;"></div></div><div class="steps-progress-label">' + prog.done + "/" + prog.total + " pasos</div></div>";
    }
    if (!t.pasos || !t.pasos.length) return "";
    var done = t.pasos.filter(function (s) { return s.hecho; }).length;
    var total = t.pasos.length;
    var pct = Math.round((done / total) * 100);
    return '<div class="steps-progress-wrap"><div class="steps-progress"><div class="steps-progress-bar" style="width:' + pct + '%;"></div></div><div class="steps-progress-label">' + done + "/" + total + " pasos</div></div>";
  }

  function buildDetailRowHtml(t) {
    var inner;
    if (t.pasosGrid && t.pasosGrid.length) {
      inner = buildPasosGridDetailHtml(t);
    } else if (!t.pasos || !t.pasos.length) {
      inner = '<div class="steps-empty-hint">Sin pasos cargados. Agregalos con ✎.</div>';
    } else {
      inner = t.pasos.map(function (s, i) {
        return '<label class="detail-step-row">' +
          '<input type="checkbox" class="detail-step-check" data-task-id="' + t.id + '" data-step-index="' + i + '"' + (s.hecho ? " checked" : "") + ' />' +
          '<span class="detail-step-text">' + escapeHtml(s.texto) + "</span>" +
        "</label>";
      }).join("");
    }
    return '<tr class="steps-detail-row" data-detail-for="' + t.id + '"><td colspan="6"><div class="steps-detail">' + inner + "</div></td></tr>";
  }

  function buildRowHtml(t) {
    var overdue = isOverdue(t);
    var estadoInfo = ESTADOS[t.estado];
    var armed = t.id === pendingDeleteId;
    var expanded = !!expandedIds[t.id];
    var mainRow = '<tr class="' + (overdue ? "is-overdue" : "") + (expanded ? " is-expanded" : "") + '" data-row-id="' + t.id + '">' +
      '<td class="lote">' + escapeHtml(t.lote) + "</td>" +
      '<td class="producto-cell"><div class="producto">' + escapeHtml(t.producto) + "</div>" +
        (t.pasosGrid || !t.ensayo ? "" : '<div class="ensayo">' + escapeHtml(t.ensayo) + "</div>") +
        stepsProgressHtml(t) + "</td>" +
      '<td class="priority-' + t.prioridad + '">' + PRIORIDADES[t.prioridad] + "</td>" +
      '<td class="fecha' + (overdue ? " overdue" : "") + '">' + formatDate(t.fecha) + "</td>" +
      '<td class="estado-cell"><span class="chip ' + estadoInfo.chip + '">' + estadoInfo.label + "</span>" +
        (t.bloqueada ? '<div class="blocked-note">⏸ ' + escapeHtml(t.bloqueadaPor || "Bloqueada") + "</div>" : "") +
      "</td>" +
      '<td class="actions-cell"><div class="row-actions">' +
        '<button type="button" class="btn-ghost" data-action="edit" data-id="' + t.id + '" title="Editar" aria-label="Editar tarea">✎</button>' +
        '<button type="button" class="' + (armed ? "btn-danger-armed" : "btn-danger-ghost") + '" data-action="delete" data-id="' + t.id + '" title="' + (armed ? "Confirmar eliminación" : "Eliminar") + '" aria-label="' + (armed ? "Confirmar eliminación, tocá de nuevo" : "Eliminar tarea") + '">' + (armed ? "¿Eliminar?" : "✕") + "</button>" +
      "</div></td>" +
    "</tr>";
    return expanded ? mainRow + buildDetailRowHtml(t) : mainRow;
  }

  function buildBucketHtml(def, list) {
    var isOpen = openState.hasOwnProperty(def.key) ? openState[def.key] : def.openDefault;
    var rows = list.map(buildRowHtml).join("");
    var cls = "bucket" + (def.dashed ? " is-inbox" : "");
    return '<details class="' + cls + '" data-bucket="' + def.key + '" style="--bucket-color:' + def.color + ';"' + (isOpen ? " open" : "") + ">" +
      '<summary><span class="bucket-name">' + def.label + '</span><span class="bucket-count">' + list.length + '</span><span class="bucket-hint">' + def.hint + "</span></summary>" +
      '<div class="table-wrap"><table><thead><tr>' +
        "<th>Lote</th><th>Producto / Ensayo</th><th>Prioridad</th><th>Vence</th><th>Estado</th><th style=\"width:1%;\"></th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
    "</details>";
  }

  function render() {
    renderStats();
    refreshFacetOptions();
    var filtered = applyFilters(tasks);
    var groups = bucketize(filtered);
    emptyState.hidden = filtered.length !== 0;

    bucketsEl.innerHTML = BUCKET_DEFS
      .filter(function (def) { return groups[def.key].length > 0; })
      .map(function (def) { return buildBucketHtml(def, groups[def.key]); })
      .join("");

    bucketsEl.querySelectorAll("details.bucket").forEach(function (details) {
      details.addEventListener("toggle", function () {
        openState[details.getAttribute("data-bucket")] = details.open;
      });
    });
  }

  function formatDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  [fSearch, fEstado, fPrioridad, fEnsayo].forEach(function (el) {
    el.addEventListener("input", render);
  });

  var pendingDeleteId = null;
  var pendingDeleteTimer = null;
  var expandedIds = {};

  function updateRowProgress(taskId) {
    var t = tasks.find(function (x) { return x.id === taskId; });
    if (!t) return;
    var mainRow = bucketsEl.querySelector('tr[data-row-id="' + taskId + '"]');
    if (!mainRow) return;
    var cell = mainRow.querySelector(".producto-cell");
    var existingWrap = cell.querySelector(".steps-progress-wrap");
    var html = stepsProgressHtml(t);
    if (existingWrap) {
      if (html) existingWrap.outerHTML = html;
      else existingWrap.remove();
    } else if (html) {
      cell.insertAdjacentHTML("beforeend", html);
    }
  }

  function toggleRowExpansion(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    var mainRow = bucketsEl.querySelector('tr[data-row-id="' + id + '"]');
    if (!mainRow) return;
    var next = mainRow.nextElementSibling;
    var isOpen = next && next.classList.contains("steps-detail-row") && next.getAttribute("data-detail-for") === id;
    if (isOpen) {
      next.remove();
      delete expandedIds[id];
      mainRow.classList.remove("is-expanded");
    } else {
      mainRow.insertAdjacentHTML("afterend", buildDetailRowHtml(t));
      expandedIds[id] = true;
      mainRow.classList.add("is-expanded");
    }
  }

  var pendingStepConfirm = null;
  var pendingStepConfirmTimer = null;
  function clearStepConfirmVisual() {
    var row = bucketsEl.querySelector(".detail-step-row.is-confirming");
    if (!row) return;
    row.classList.remove("is-confirming");
    var hint = row.querySelector(".confirm-hint");
    if (hint) hint.remove();
  }

  bucketsEl.addEventListener("click", function (e) {
    var cb = e.target.closest(".detail-step-check");
    if (!cb) return;
    var taskId = cb.getAttribute("data-task-id");
    var stepIndex = cb.getAttribute("data-step-index");
    var row = cb.closest(".detail-step-row");
    var isArmed = pendingStepConfirm && pendingStepConfirm.taskId === taskId && pendingStepConfirm.stepIndex === stepIndex;
    if (!isArmed) {
      e.preventDefault();
      clearStepConfirmVisual();
      clearTimeout(pendingStepConfirmTimer);
      pendingStepConfirm = { taskId: taskId, stepIndex: stepIndex };
      row.classList.add("is-confirming");
      row.querySelector(".detail-step-text").insertAdjacentHTML("afterend", '<span class="confirm-hint">Tocá de nuevo para confirmar</span>');
      pendingStepConfirmTimer = setTimeout(function () {
        pendingStepConfirm = null;
        clearStepConfirmVisual();
      }, 3000);
      return;
    }
    clearTimeout(pendingStepConfirmTimer);
    pendingStepConfirm = null;
    clearStepConfirmVisual();
    var t = tasks.find(function (x) { return x.id === taskId; });
    var idx = Number(stepIndex);
    if (!t || !t.pasos || !t.pasos[idx]) return;
    t.pasos[idx].hecho = cb.checked;
    save();
    updateRowProgress(taskId);
  });

  var pendingDetailPasoKey = null;
  var pendingDetailPasoTimer = null;
  function renderDetailPasosGrid(t) {
    var tableEl = bucketsEl.querySelector('.pasos-grid-table[data-task-id="' + t.id + '"]');
    if (!tableEl) return;
    var confirmKey = null;
    var prefix = t.id + "|";
    if (pendingDetailPasoKey && pendingDetailPasoKey.indexOf(prefix) === 0) {
      confirmKey = pendingDetailPasoKey.slice(prefix.length);
    }
    tableEl.innerHTML = buildPasosGridTableHtml(t.pasosGrid, confirmKey);
  }

  bucketsEl.addEventListener("click", function (e) {
    var cb = e.target.closest(".pasos-grid-table input[type=\"checkbox\"]");
    if (!cb || cb.disabled) return;
    e.preventDefault();
    var tableEl = cb.closest(".pasos-grid-table");
    var taskId = tableEl.getAttribute("data-task-id");
    var t = tasks.find(function (x) { return x.id === taskId; });
    if (!t || !t.pasosGrid) return;
    var i = cb.getAttribute("data-row"), col = cb.getAttribute("data-col"), kind = cb.getAttribute("data-kind");
    var key = taskId + "|" + i + "|" + col + "|" + kind;
    if (pendingDetailPasoKey !== key) {
      clearTimeout(pendingDetailPasoTimer);
      pendingDetailPasoKey = key;
      pendingDetailPasoTimer = setTimeout(function () {
        pendingDetailPasoKey = null;
        renderDetailPasosGrid(t);
      }, 3000);
      renderDetailPasosGrid(t);
      return;
    }
    clearTimeout(pendingDetailPasoTimer);
    pendingDetailPasoKey = null;
    var row = t.pasosGrid[Number(i)];
    row.estados[col] = row.estados[col] === kind ? null : kind;
    save();
    renderDetailPasosGrid(t);
    updateRowProgress(taskId);
  });

  function armDeleteButton(btn) {
    btn.className = "btn-danger-armed";
    btn.textContent = "¿Eliminar?";
    btn.title = "Confirmar eliminación";
    btn.setAttribute("aria-label", "Confirmar eliminación, tocá de nuevo");
  }
  function disarmDeleteButtonById(id) {
    var btn = bucketsEl.querySelector('button[data-action="delete"][data-id="' + id + '"]');
    if (!btn) return;
    btn.className = "btn-danger-ghost";
    btn.textContent = "✕";
    btn.title = "Eliminar";
    btn.setAttribute("aria-label", "Eliminar tarea");
  }

  bucketsEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-action]");
    if (!btn) {
      var row = e.target.closest("tr[data-row-id]");
      if (row) toggleRowExpansion(row.getAttribute("data-row-id"));
      return;
    }
    var id = btn.getAttribute("data-id");
    if (btn.getAttribute("data-action") === "edit") openModal(id);
    else if (btn.getAttribute("data-action") === "delete") {
      var t = tasks.find(function (x) { return x.id === id; });
      if (!t) return;
      if (pendingDeleteId !== id) {
        pendingDeleteId = id;
        armDeleteButton(btn);
        clearTimeout(pendingDeleteTimer);
        pendingDeleteTimer = setTimeout(function () {
          pendingDeleteId = null;
          disarmDeleteButtonById(id);
        }, 3000);
        return;
      }
      clearTimeout(pendingDeleteTimer);
      pendingDeleteId = null;
      delete expandedIds[id];
      tasks = tasks.filter(function (x) { return x.id !== id; });
      save();
      render();
    }
  });

  var currentPasosGrid = [];
  var pendingModalPasoKey = null;
  var pendingModalPasoTimer = null;
  function renderModalPasosGrid() {
    $("pasos-grid-table").innerHTML = buildPasosGridTableHtml(currentPasosGrid, pendingModalPasoKey);
  }
  $("pasos-grid-table").addEventListener("click", function (e) {
    var cb = e.target.closest('input[type="checkbox"]');
    if (!cb || cb.disabled) return;
    e.preventDefault();
    var i = cb.getAttribute("data-row"), col = cb.getAttribute("data-col"), kind = cb.getAttribute("data-kind");
    var key = i + "|" + col + "|" + kind;
    if (pendingModalPasoKey !== key) {
      clearTimeout(pendingModalPasoTimer);
      pendingModalPasoKey = key;
      pendingModalPasoTimer = setTimeout(function () { pendingModalPasoKey = null; renderModalPasosGrid(); }, 3000);
      renderModalPasosGrid();
      return;
    }
    clearTimeout(pendingModalPasoTimer);
    pendingModalPasoKey = null;
    var row = currentPasosGrid[Number(i)];
    row.estados[col] = row.estados[col] === kind ? null : kind;
    renderModalPasosGrid();
  });

  function openModal(id) {
    form.reset();
    var t = id ? tasks.find(function (x) { return x.id === id; }) : null;
    modalTitle.textContent = t ? "Editar tarea" : "Nueva tarea";
    $("m-id").value = t ? t.id : "";
    $("m-lote").value = t && t.lote !== "—" ? t.lote : "";
    $("m-producto").value = t ? t.producto : "";
    $("m-prioridad").value = t ? t.prioridad : "media";
    $("m-fecha").value = (t && t.fecha) ? t.fecha : todayStr();
    $("m-estado").value = t ? t.estado : "pendiente";
    $("m-notas").value = t ? t.notas || "" : "";
    var blocked = t ? !!t.bloqueada : false;
    $("m-bloqueada").checked = blocked;
    $("m-bloqueada-por").value = t ? t.bloqueadaPor || "" : "";
    $("m-bloqueada-wrap").hidden = !blocked;
    if (t) {
      currentPasosGrid = t.pasosGrid ? t.pasosGrid.map(function (r) { return { texto: r.texto, estados: Object.assign({}, r.estados) }; }) : migratePasosToGrid(t);
    } else {
      currentPasosGrid = defaultPasosGrid();
    }
    pendingModalPasoKey = null;
    clearTimeout(pendingModalPasoTimer);
    renderModalPasosGrid();
    backdrop.hidden = false;
    $("m-lote").focus();
  }
  function closeModal() { backdrop.hidden = true; }

  $("btn-new").addEventListener("click", function () { openModal(null); });
  $("btn-cancel").addEventListener("click", closeModal);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !backdrop.hidden) closeModal(); });
  $("m-bloqueada").addEventListener("change", function () {
    $("m-bloqueada-wrap").hidden = !this.checked;
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var id = $("m-id").value;
    var blocked = $("m-bloqueada").checked;
    var base = {
      lote: $("m-lote").value.trim(),
      producto: $("m-producto").value.trim(),
      pasosGrid: currentPasosGrid,
      prioridad: $("m-prioridad").value,
      fecha: $("m-fecha").value,
      estado: $("m-estado").value,
      notas: $("m-notas").value.trim(),
      bloqueada: blocked,
      bloqueadaPor: blocked ? $("m-bloqueada-por").value.trim() : "",
      triaged: true
    };

    if (!id) {
      tasks.push(Object.assign({ id: uid() }, base));
    } else {
      var existing = tasks.find(function (x) { return x.id === id; });
      Object.assign(existing, base);
      delete existing.pasos;
      delete existing.ensayo;
    }
    save();
    closeModal();
    render();
  });

  quickForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = quickInput.value.trim();
    if (!text) return;
    tasks.push({
      id: uid(),
      lote: "—",
      producto: text,
      ensayo: "Otro",
      prioridad: "media",
      estado: "pendiente",
      fecha: null,
      notas: "",
      triaged: false,
      bloqueada: false,
      bloqueadaPor: "",
      pasos: []
    });
    save();
    quickInput.value = "";
    render();
    quickInput.focus();
  });

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
